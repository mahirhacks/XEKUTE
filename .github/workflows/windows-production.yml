name: Windows production gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2022
    # `secrets` is not allowed inside `if:` conditions, so surface the signing
    # credential presence as an env flag once, at the job level.
    env:
      HAS_SIGNING_CERT: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify installer build inputs
        shell: pwsh
        run: |
          if (!(Test-Path .\electron-builder.config.js)) { throw "electron-builder.config.js is missing from the checkout." }
          if (!(Test-Path .\build\installer.nsh)) { throw "build/installer.nsh is missing from the checkout." }
      - run: npm run audit:dependencies
      - run: npm run verify:native
      - run: npm run verify:production
      - run: npm test
      - name: Build signed installer when signing credentials are configured
        if: env.HAS_SIGNING_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\xekute-signing.pfx", [Convert]::FromBase64String("${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}"))
          $env:WIN_CSC_LINK = "$env:RUNNER_TEMP\xekute-signing.pfx"
          $env:WIN_CSC_KEY_PASSWORD = "$env:WINDOWS_CERTIFICATE_PASSWORD"
          npm run make
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run release:metadata
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build unsigned installer
        if: env.HAS_SIGNING_CERT == 'false'
        shell: pwsh
        run: |
          npm run make
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run release:metadata
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: xekute-windows-package
          path: |
            out/XEKUTE-win32-x64
            out/make/nsis
