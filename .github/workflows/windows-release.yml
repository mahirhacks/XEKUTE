name: Windows release

# Publishes a GitHub Release (full release, never pre-release) for the
# assisted NSIS installer and electron-updater.
# Trigger with: git tag v<package.json version> && git push origin <tag>

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    # `secrets` is not allowed inside `if:` conditions (GitHub Actions
    # restriction), so surface signing credential presence as an env flag.
    env:
      HAS_SIGNING_CERT: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # Keep release tags and package metadata identical.
      - name: Tag must match package.json version
        shell: bash
        run: |
          node -e "const p=require('./package.json');const tag=process.env.GITHUB_REF_NAME.replace(/^v/,'');if(tag!==p.version){console.error('Tag '+process.env.GITHUB_REF_NAME+' does not match package.json version '+p.version);process.exit(1)}"
          test -f "docs/release-notes/${GITHUB_REF_NAME}.md"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - run: npm ci
      - run: npm run audit:dependencies
      - name: Verify installer build inputs
        shell: pwsh
        run: |
          if (!(Test-Path .\electron-builder.config.js)) { throw "electron-builder.config.js is missing from the checkout." }
          if (!(Test-Path .\build\installer.nsh)) { throw "build/installer.nsh is missing from the checkout." }
      - run: npm run verify:native
      - run: npm run verify:production
      - run: npm test

      - name: Build signed installer
        if: env.HAS_SIGNING_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\xekute-signing.pfx", [Convert]::FromBase64String("${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}"))
          $env:WIN_CSC_LINK = "$env:RUNNER_TEMP\xekute-signing.pfx"
          $env:WIN_CSC_KEY_PASSWORD = "$env:WINDOWS_CERTIFICATE_PASSWORD"
          npm run make
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run release:metadata
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build unsigned installer
        if: env.HAS_SIGNING_CERT == 'false'
        shell: pwsh
        run: |
          npm run make
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run release:metadata
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Store verified release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-release-${{ github.sha }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          path: |
            out/make/nsis/XEKUTESetup.exe
            out/make/nsis/XEKUTESetup.exe.blockmap
            out/make/nsis/latest.yml
            out/make/SHA256SUMS.txt
            out/make/xekute-sbom.cdx.json

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release-${{ github.sha }}
          path: release-assets
      - name: Publish release assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          fail_on_unmatched_files: true
          files: |
            release-assets/nsis/XEKUTESetup.exe
            release-assets/nsis/XEKUTESetup.exe.blockmap
            release-assets/nsis/latest.yml
            release-assets/SHA256SUMS.txt
            release-assets/xekute-sbom.cdx.json
          generate_release_notes: true
          body_path: docs/release-notes/${{ github.ref_name }}.md
        # Deliberately NOT pre-release: electron-updater consumes stable
        # GitHub release metadata and latest.yml.
