<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pointer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@vscode/codicons@0.0.36/dist/codicon.css" />
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css" />
  <link rel="stylesheet" href="../node_modules/monaco-editor/min/vs/editor/editor.main.css" />
  <link rel="stylesheet" href="../node_modules/highlight.js/styles/github-dark.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app-shell">
  <div id="app-topbar">
    <nav id="app-menu" aria-label="Application menu">
      <div class="app-menu-item">
        <button type="button" class="app-menu-button" data-menu="file">File</button>
        <div class="app-menu-dropdown" data-menu-panel="file" hidden>
          <button type="button" data-action="new-file">New File</button>
          <button type="button" data-action="new-folder">New Folder</button>
          <button type="button" data-action="open-file">Open File...</button>
          <button type="button" data-action="open-folder">Open Folder...</button>
        </div>
      </div>
      <div class="app-menu-item">
        <button type="button" class="app-menu-button" data-menu="edit">Edit</button>
        <div class="app-menu-dropdown" data-menu-panel="edit" hidden>
          <button type="button" data-action="undo">Undo</button>
          <button type="button" data-action="redo">Redo</button>
          <button type="button" data-action="cut">Cut</button>
          <button type="button" data-action="copy">Copy</button>
          <button type="button" data-action="paste">Paste</button>
        </div>
      </div>
      <div class="app-menu-item">
        <button type="button" class="app-menu-button" data-menu="view">View</button>
        <div class="app-menu-dropdown" data-menu-panel="view" hidden>
          <button type="button" data-action="toggle-terminal">Toggle Terminal</button>
          <button type="button" data-action="toggle-chat">Toggle Chat</button>
        </div>
      </div>
      <div class="app-menu-item">
        <button type="button" class="app-menu-button" data-menu="terminal">Terminal</button>
        <div class="app-menu-dropdown" data-menu-panel="terminal" hidden>
          <button type="button" data-action="new-terminal">New Terminal</button>
          <button type="button" data-action="clear-terminal">Clear Terminal</button>
          <button type="button" data-action="kill-terminal">Kill Terminal</button>
        </div>
      </div>
      <div class="app-menu-item">
        <button type="button" class="app-menu-button" data-menu="help">Help</button>
        <div class="app-menu-dropdown" data-menu-panel="help" hidden>
          <button type="button" data-action="about">About Pointer</button>
        </div>
      </div>
      <div class="app-menu-item">
        <button type="button" class="app-menu-button" data-menu="run">Run</button>
        <div class="app-menu-dropdown" data-menu-panel="run" hidden>
          <button type="button" id="menu-run-code" data-action="run-code" disabled>Run Code</button>
          <button type="button" id="menu-configure-run" data-action="configure-run">Configure Run Command...</button>
        </div>
      </div>
    </nav>
    <div class="app-topbar-spacer"></div>
    <button type="button" id="btn-top-terminal" class="topbar-icon active" title="Toggle terminal">
      <span class="codicon codicon-terminal"></span>
    </button>
    <button type="button" id="btn-top-chat" class="topbar-icon active" title="Toggle AI chat">
      <span class="codicon codicon-comment-discussion"></span>
    </button>
    <button type="button" id="btn-window-minimize" class="window-control" title="Minimize">
      <span class="codicon codicon-chrome-minimize"></span>
    </button>
    <button type="button" id="btn-window-maximize" class="window-control" title="Maximize">
      <span class="codicon codicon-chrome-maximize"></span>
    </button>
    <button type="button" id="btn-window-close" class="window-control close" title="Close">
      <span class="codicon codicon-chrome-close"></span>
    </button>
  </div>
  <div id="layout">
    <aside id="sidebar">
      <div id="sidebar-header">
        <button type="button" id="explorer-root-toggle" class="explorer-root-toggle" title="Toggle project tree">
          <span id="explorer-root-chevron" class="codicon codicon-chevron-down"></span>
          <span id="explorer-title" class="panel-title" title="">Explorer</span>
        </button>
        <div class="sidebar-actions">
          <button id="btn-new-file" class="icon-btn" title="New File" disabled>
            <span class="codicon codicon-new-file"></span>
          </button>
          <button id="btn-new-folder" class="icon-btn" title="New Folder" disabled>
            <span class="codicon codicon-new-folder"></span>
          </button>
          <button id="btn-open-folder" class="icon-btn" title="Open Folder">
            <span class="codicon codicon-folder-opened"></span>
          </button>
        </div>
      </div>
      <div id="file-tree"></div>
    </aside>

    <div id="sidebar-resize" class="sash-v"></div>

    <div id="center-panel">
      <main id="editor-pane">
        <div id="editor-tab-bar"></div>
        <div id="editor-body">
          <div id="editor-empty">
            <span class="codicon codicon-files"></span>
            <p>Select a file from the explorer to open it.</p>
          </div>
          <div id="editor-view" hidden>
            <div id="monaco-container"></div>
            <div id="editor-error" hidden></div>
          </div>
        </div>
      </main>

      <div id="terminal-resize" class="sash-h"></div>

      <section id="terminal-pane">
        <div id="terminal-header">
          <span class="panel-title">Terminal</span>
          <div class="terminal-actions">
            <button id="btn-terminal-new" class="icon-btn terminal-action" title="New Terminal">
              <span class="codicon codicon-add"></span>
            </button>
            <button id="btn-terminal-clear" class="icon-btn terminal-action" title="Clear Terminal" disabled>
              <span class="codicon codicon-clear-all"></span>
            </button>
            <button id="btn-terminal-kill" class="icon-btn terminal-action" title="Kill Terminal" disabled>
              <span class="codicon codicon-trash"></span>
            </button>
          </div>
        </div>
        <div id="terminal-body">
          <div id="terminal-tabs-list" hidden></div>
          <div id="terminal-viewport">
            <div id="terminal-empty">
              <button type="button" id="btn-terminal-create" class="terminal-create-btn">
                <span class="codicon codicon-terminal"></span>
                Create Terminal
              </button>
            </div>
          </div>
        </div>
      </section>
    </div>

    <div id="chat-resize" class="sash-v"></div>

    <aside id="chat-pane">
      <div id="chat-header">
        <div id="chat-session-select" class="chat-session-tabs" title="Chat sessions"></div>
        <div class="chat-session-controls">
          <button type="button" id="btn-chat-new" class="icon-btn chat-session-action" title="New chat">
            <span class="codicon codicon-add"></span>
          </button>
          <button type="button" id="btn-chat-history" class="icon-btn chat-session-action" title="Chat history">
            <span class="codicon codicon-history"></span>
          </button>
          <button type="button" id="btn-chat-more" class="icon-btn chat-session-action" title="Chat options">
            <span class="codicon codicon-ellipsis"></span>
          </button>
          <button type="button" id="btn-chat-collapse" class="icon-btn chat-session-action" title="Collapse chat">
            <span class="codicon codicon-layout-sidebar-right"></span>
          </button>
        </div>
      </div>

      <div id="messages"></div>

      <div id="input-bar">
        <div class="composer">
          <textarea id="chat-input" placeholder="Plan, Build, / for skills, @ for context" rows="1"></textarea>
          <div id="chat-input-measure" aria-hidden="true"></div>
          <div class="composer-toolbar">
            <button type="button" id="model-picker" class="model-pill" title="Select model">
              <span id="model-label">Select model</span>
              <span class="codicon codicon-chevron-down model-chevron"></span>
            </button>
            <div class="composer-actions">
              <button type="button" id="context-usage-btn" class="context-ring-btn" title="Context usage" aria-expanded="false">
                <svg class="context-ring" viewBox="0 0 20 20" aria-hidden="true">
                  <circle class="context-ring-bg" cx="10" cy="10" r="8"></circle>
                  <circle id="context-ring-fill" class="context-ring-fill" cx="10" cy="10" r="8"></circle>
                </svg>
              </button>
              <button id="send-btn" class="send-btn" title="Send message" disabled>
                <span class="codicon codicon-arrow-up"></span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </aside>
  </div>

  <footer id="statusbar">
    <div class="statusbar-left"></div>
    <div class="statusbar-right">
      <span id="status-ln-col" class="statusbar-item">Ln 1, Col 1</span>
      <span id="status-ollama-port" class="statusbar-item">Ollama :11434</span>
    </div>
  </footer>
  </div>

  <div id="context-usage-popover" class="context-usage-popover" hidden>
    <div class="context-usage-title">Context window</div>
    <div class="context-usage-track">
      <div id="context-usage-fill" class="context-usage-fill"></div>
    </div>
    <div class="context-usage-meta">
      <span id="context-usage-used">0 used</span>
      <span id="context-usage-free">32K free</span>
    </div>
    <div id="context-usage-pct" class="context-usage-pct">0% used · 32K max</div>
  </div>

  <div id="model-menu" class="model-menu" hidden>
    <input id="model-search" type="text" placeholder="Search models" spellcheck="false" />
    <div id="model-list" class="model-list"></div>
    <div class="model-menu-divider"></div>
    <button type="button" id="model-add-btn" class="model-add-btn">
      <span class="codicon codicon-add"></span>
      Add Models
    </button>
    <div id="model-add-form" class="model-add-form" hidden>
      <input id="model-custom" type="text" placeholder="model-name:tag" spellcheck="false" />
      <button type="button" id="model-custom-add" class="model-custom-add">Add</button>
    </div>
  </div>

  <div id="model-edit-menu" class="model-edit-menu" hidden>
    <div class="model-edit-section">
      <div class="model-edit-label">Options</div>
      <div class="model-edit-row">
        <span class="model-edit-row-name">Thinking</span>
        <button type="button" id="thinking-toggle" class="toggle-switch" aria-pressed="false" title="Enable thinking">
          <span class="toggle-thumb"></span>
        </button>
      </div>
    </div>
    <div class="model-edit-divider"></div>
    <div class="model-edit-section">
      <div class="model-edit-label">Context</div>
      <div id="context-options" class="context-options"></div>
    </div>
  </div>

  <script src="../node_modules/marked/lib/marked.umd.js"></script>
  <script src="../node_modules/dompurify/dist/purify.min.js"></script>
  <script src="../node_modules/mermaid/dist/mermaid.min.js"></script>
  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="../node_modules/monaco-editor/min/vs/loader.js"></script>
  <script src="editor.js"></script>
  <script src="terminal.js"></script>
  <script src="tools/tool-map.js"></script>
  <script src="tools/tools.js"></script>
  <script src="markdown.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
